<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Tomy vs. Valen Pong Challenge!</title>
    <link rel="stylesheet" href="pong.css?v=mobile2">
</head>

<body>
    <section id="portada">
        <img src="portada.png" alt="Tomy vs. Valen Pong Challenge">
        <div class="pulsa"><span class="pc-only">PRESIONÁ ESPACIO PARA COMENZAR</span><span class="touch-only">TOCÁ LA PANTALLA PARA COMENZAR</span></div>
    </section>

    <section id="menu" class="oculto panel">
        <h1>TOMY VS. VALEN</h1>
        <h2>PONG CHALLENGE!</h2>
        <button data-modo="1">1 JUGADOR</button>
        <button data-modo="2" class="pc-only-block">2 JUGADORES</button>
        <p>1 jugador: Tomy vs. Valen CPU</p>
        <p class="pc-only-block">2 jugadores: Tomy W/S · Valen ↑/↓</p>
        <small>ESC: volver</small>
    </section>

    <main id="juego" class="oculto">
        <header><span>TOMY <b id="pt1">0</b></span><strong id="modoTxt"></strong><span><b id="pt2">0</b> VALEN</span></header>
        <canvas id="canvas" width="960" height="600"></canvas>
        <footer><span class="pc-only">Tomy: W/S · En 1 jugador también ↑/↓ · Valen: ↑/↓ · P: pausa · ESC: menú</span><span class="touch-only">DESLIZÁ ARRIBA / ABAJO PARA MOVER A TOMY</span></footer>
        <div id="fin" class="oculto"></div>
    </main>
    <script src="pong.js?v=mobile2"></script>
</body>

</html>
