<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Caritolina's Tidy Up!</title>
    <link rel="stylesheet" href="sokoban.css?v=mobile4">
</head>

<body>
    <section id="portada">
        <img src="portada_caritolina.png" alt="Caritolina's Tidy Up!">
        <div class="pulsa"><span class="pc-only">PRESIONÁ ESPACIO PARA JUGAR</span><span class="touch-only">TOCÁ LA PANTALLA PARA JUGAR</span></div>
    </section>

    <main id="juego" class="oculto">
        <header>
            <span id="nombreNivel">NIVEL</span>
            <span>MOVIMIENTOS: <b id="movimientos">0</b></span>
            <span>FALTAN: <b id="faltan">0</b></span>
        </header>
        <canvas id="canvas" width="768" height="576"></canvas>
        <footer><span class="pc-controls">FLECHAS / WASD: MOVER · R: REINICIAR · P: PAUSA · ESC: PORTADA</span><span class="mobile-controls">DESLIZÁ PARA MOVER</span></footer>
        <div id="cartel" class="oculto"></div>
    </main>
    <div id="portraitOnly"><div>📱↻</div><strong>GIRÁ EL CELULAR</strong><span>Caritolina's Tidy Up! se juega en vertical</span></div>
<script src="sokoban.js?v=mobile4"></script>
</body>

</html>
